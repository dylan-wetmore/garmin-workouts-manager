[project]
name = "garmin-workouts-manager"
version = "0.1.0"
description = "Describe workouts in plain YAML (any sport) and sync them to your Garmin devices."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "garminconnect>=0.3.8",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# For scripts/generate_exercises.py (regenerates gwm/exercises.py from the FIT SDK)
gen = ["garmin-fit-sdk>=21.0"]

[project.scripts]
gwm = "gwm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gwm"]
